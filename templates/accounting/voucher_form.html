{% extends "base.html" %}

{% block title %}{% if voucher %}編輯傳票{% else %}新增傳票{% endif %} - 清發畜牧場管理系統{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/accounting/vouchers">傳票管理</a></li>
                <li class="breadcrumb-item active">{% if voucher %}編輯{% else %}新增{% endif %}</li>
            </ol>
        </nav>
        <h2><i class="bi bi-{% if voucher %}pencil{% else %}plus-circle{% endif %}"></i> {% if voucher %}編輯傳票{% else %}新增傳票{% endif %}</h2>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form id="voucherForm" action="/accounting/api/vouchers/{% if voucher %}{{ voucher.id }}/update{% else %}create{% endif %}" method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label required">傳票號碼</label>
                    <input type="text" class="form-control" name="voucher_number" value="{{ voucher.voucher_number if voucher else voucher_number }}" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">傳票日期</label>
                    <input type="date" class="form-control" name="voucher_date" value="{{ voucher.voucher_date.strftime('%Y-%m-%d') if voucher and voucher.voucher_date else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">金額</label>
                    <input type="number" class="form-control" name="amount" value="{{ voucher.amount if voucher else '' }}" min="0" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label required">借方科目</label>
                    <select class="form-select" name="debit_account_id" required>
                        <option value="">請選擇</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" {% if voucher and voucher.debit_account_id == account.id %}selected{% endif %}>
                            {{ account.code }} - {{ account.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">貸方科目</label>
                    <select class="form-select" name="credit_account_id" required>
                        <option value="">請選擇</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" {% if voucher and voucher.credit_account_id == account.id %}selected{% endif %}>
                            {{ account.code }} - {{ account.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-12">
                    <label class="form-label">說明</label>
                    <textarea class="form-control" name="description" rows="3">{{ voucher.description if voucher else '' }}</textarea>
                </div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex justify-content-between">
                <a href="/accounting/vouchers" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回列表
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {% if voucher %}更新{% else %}建立{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('voucherForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    fetch(this.action, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            showToast(result.message, 'success');
            setTimeout(() => {
                window.location.href = '/accounting/vouchers';
            }, 1000);
        } else {
            showToast(result.detail || '操作失敗', 'error');
        }
    });
});
</script>
{% endblock %}

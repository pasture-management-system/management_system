{% extends "base.html" %}

{% block title %}營業報表 - 清發畜牧場管理系統{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2><i class="bi bi-graph-up"></i> 營業報表</h2>
        <p class="text-muted mb-0">查看各類營業報表</p>
    </div>
</div>

<!-- 報表類型選擇 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-cart-plus text-primary" style="font-size: 3rem;"></i>
                <h5 class="mt-3">進貨報表</h5>
                <p class="text-muted">查看進貨金額統計</p>
                <a href="/reports/purchase" class="btn btn-outline-primary">查看報表</a>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-cart-dash text-success" style="font-size: 3rem;"></i>
                <h5 class="mt-3">銷貨報表</h5>
                <p class="text-muted">查看銷貨金額統計</p>
                <a href="/reports/sales" class="btn btn-outline-success">查看報表</a>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-cash-stack text-info" style="font-size: 3rem;"></i>
                <h5 class="mt-3">損益報表</h5>
                <p class="text-muted">查看損益分析</p>
                <a href="/reports/profit" class="btn btn-outline-info">查看報表</a>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-clipboard-data text-warning" style="font-size: 3rem;"></i>
                <h5 class="mt-3">牛隻報表</h5>
                <p class="text-muted">查看牛隻庫存統計</p>
                <a href="/reports/cattle" class="btn btn-outline-warning">查看報表</a>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-file-earmark-minus text-danger" style="font-size: 3rem;"></i>
                <h5 class="mt-3">應付報表</h5>
                <p class="text-muted">查看應付帳款統計</p>
                <a href="/reports/payable" class="btn btn-outline-danger">查看報表</a>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
                <i class="bi bi-file-earmark-plus text-primary" style="font-size: 3rem;"></i>
                <h5 class="mt-3">應收報表</h5>
                <p class="text-muted">查看應收帳款統計</p>
                <a href="/reports/receivable" class="btn btn-outline-primary">查看報表</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
